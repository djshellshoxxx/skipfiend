name: SKIPFIEND CI

on:
  push:
    branches: [ main, "audit/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrandr-dev \
            libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKIPFIEND_BUILD_TESTS=ON -DSKIPFIEND_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build shipping targets
        run: cmake --build build --target SKIPFIEND_VST3 SKIPFIEND_Standalone --config Release --parallel 2

      - name: Build headless tests
        run: cmake --build build --target SKIPFIEND_Tests --config Release --parallel 2

      - name: Run headless tests
        run: ctest --test-dir build --output-on-failure -C Release
